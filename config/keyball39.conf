# Bluetooth connection optimization for split keyboard + pointing device
# Interval 10 = 12.5ms - sweet spot for split + trackball
# Tighter range (8-10) for more consistent timing, less catchup lag
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=10
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=8
CONFIG_BT_PERIPHERAL_PREF_LATENCY=10
# Increased buffers for split keyboard + trackball traffic
CONFIG_BT_BUF_ACL_TX_COUNT=64
CONFIG_BT_L2CAP_TX_BUF_COUNT=64

# Debouncing - optimized for wireless splits
# Press 3ms: Prevents spacebar double-taps in terminal
# Release 5ms: Quick release detection prevents stuck keys
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=3
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# Deep sleep disabled - left half cannot wake from key press in deep sleep mode
# The board still has excellent power management without deep sleep:
# - Display turns off after inactivity
# - Bluetooth enters low-power mode  
# - Expected battery life: 1-2 weeks of normal use
# If you want deep sleep, you'll need to toggle power switches to wake both halves
# CONFIG_ZMK_SLEEP=y
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=14400000

# set transmission power to max
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=512

CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
CONFIG_ZMK_EXT_POWER=y

# Mouse/pointing settings for smoother cursor movement
CONFIG_ZMK_POINTING=y

# Prefer Bluetooth output by default (can still switch to USB with &out OUT_USB)
CONFIG_ZMK_USB_BOOT=n

# NOTE: PMW3610 trackball settings are in config/boards/shields/keyball_nano/keyball39_right.conf
# since only the right side has the trackball hardware
