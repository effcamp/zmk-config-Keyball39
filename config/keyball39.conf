# Deep sleep disabled - left half cannot wake from key press
# You'd need to toggle power switches on both halves to wake
# Battery life is still excellent without sleep mode
# CONFIG_ZMK_SLEEP=y
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=7200000

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Eager debouncing
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=7

# Pointing device support
CONFIG_ZMK_POINTING=y

# Display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
CONFIG_ZMK_EXT_POWER=y

# NOTE: PMW3610 trackball settings are in config/boards/shields/keyball_nano/keyball39_right.conf
# since only the right side has the trackball hardware
